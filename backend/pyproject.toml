[project]
name = "fital-backend"
version = "0.1.0"
description = "FitAl backend — 一句话记录型健身/饮食 app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "tortoise-orm[asyncpg]>=1.1.7",
    "pydantic-settings>=2.6.0",
    "pydantic-ai-slim[openai]>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.tortoise]
tortoise_orm = "app.db.TORTOISE_ORM"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

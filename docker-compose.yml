services:
  app:
    image: crpi-cwyvl6vckkv4k4p7.cn-hangzhou.personal.cr.aliyuncs.com/nuguri_ddd/fital:latest
    command: sh -c "tortoise migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8002:8000"
    env_file: .env
    networks:
      - cocowork-net
    restart: unless-stopped

# 复用 cocowork 那张私有网络,直接用容器名 cocowork-pg 连数据库
networks:
  cocowork-net:
    external: true
